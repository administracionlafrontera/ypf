<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Ventas y Descargas</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #F7F5F0;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100vh;
      border: none;
    }
    #fallback {
      display: none;
      font-family: Calibri, sans-serif;
      color: #1A1814;
      text-align: center;
      padding-top: 40px;
    }
    #fallback a { color: #2B5F3E; font-weight: 600; }
  </style>
</head>
<body>
  <iframe
    src="https://script.google.com/macros/s/AKfycbyYVgufAXzzqCRDpTyGNAcFZBziowf_Yh5NwBQXY9SjSBJ5AKQ_G6zEue5lUO0ItSm3/exec"
    id="appFrame"
    allow="clipboard-write">
  </iframe>
  <div id="fallback">
    <p>Si no ves el sistema cargado arriba,
      <a href="https://script.google.com/macros/s/AKfycbyYVgufAXzzqCRDpTyGNAcFZBziowf_Yh5NwBQXY9SjSBJ5AKQ_G6zEue5lUO0ItSm3/exec" target="_top">hacé click acá para abrirlo directo</a>.
    </p>
  </div>
</body>
</html>
